<mp-app-shell project="mcp-gateway" home="/overview" [nav]="nav()">
  <!-- whether the console hears about changes, in one word; folded, only its dot -->
  <ng-template mpShellStatus let-collapsed>
    <mp-status [status]="status().status" aria-live="polite" [title]="status().text">
      <span [class.sr-only]="collapsed">{{ status().text }}</span>
    </mp-status>
  </ng-template>

  <router-outlet />
</mp-app-shell>
