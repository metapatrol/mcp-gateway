<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-surface focus:px-3 focus:py-2 focus:shadow"
  >Skip to content</a
>
<div class="min-h-dvh lg:grid lg:grid-cols-[13.5rem_minmax(0,1fr)]">
  <aside
    class="z-30 flex flex-col gap-3 border-b border-line bg-sunken px-4 py-3 lg:sticky lg:top-0 lg:h-dvh lg:gap-5 lg:border-r lg:border-b-0 lg:px-3 lg:py-4"
  >
    <div class="flex items-center justify-between gap-2 px-1.5">
      <a routerLink="/overview" class="flex items-center gap-2.5" aria-label="mcp-gateway, overview">
        <span class="grid size-7 place-items-center rounded-md bg-accent" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h10M2 7h6M2 11h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" /></svg>
        </span>
        <span class="text-sm font-semibold">mcp-gateway</span>
      </a>
      <button
        type="button"
        class="grid size-7 place-items-center rounded-md text-muted hover:bg-surface hover:text-ink"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
        [title]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
      >
        @if (theme.theme() === 'dark') {
          <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="size-4"><path d="M10 2a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 2ZM10 15a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 15ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM15.657 5.404a.75.75 0 1 0-1.06-1.06l-1.061 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM6.464 14.596a.75.75 0 1 0-1.06-1.06l-1.06 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM18 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 18 10ZM5 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 5 10ZM14.596 15.657a.75.75 0 0 0 1.06-1.06l-1.06-1.061a.75.75 0 1 0-1.06 1.06l1.06 1.06ZM5.404 6.464a.75.75 0 0 0 1.06-1.06l-1.06-1.06a.75.75 0 1 0-1.061 1.06l1.06 1.06Z" /></svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor" class="size-4"><path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z" clip-rule="evenodd" /></svg>
        }
      </button>
    </div>

    <nav aria-label="Main" class="-mx-1 flex gap-1 overflow-x-auto lg:mx-0 lg:flex-col lg:overflow-visible">
      @for (item of cluster(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-surface font-semibold shadow-[inset_0_0_0_1px] shadow-line"
          class="flex items-center justify-between gap-3 rounded-md px-2 py-1.5 text-[13.5px] whitespace-nowrap hover:bg-surface"
        >
          <span>{{ item.label }}</span>
          @if (item.count !== undefined) {
            <span class="faint flex items-center gap-1.5 font-mono text-[11.5px]">
              @if (item.troubled) {
                <span class="size-1.5 rounded-full bg-bad" title="Something here is not ready"></span>
                <span class="sr-only">(something is not ready)</span>
              }
              {{ item.count }}
            </span>
          }
        </a>
      }
      <a
        routerLink="/subjects"
        routerLinkActive="bg-surface font-semibold shadow-[inset_0_0_0_1px] shadow-line"
        class="rounded-md px-2 py-1.5 text-[13.5px] whitespace-nowrap hover:bg-surface"
        >Subjects</a
      >
    </nav>

    <p class="mt-auto hidden items-center gap-2 px-2 text-xs lg:flex" aria-live="polite" [class]="status().classes">
      <span class="size-1.5 rounded-full bg-current" [class.animate-pulse]="status().pulse"></span>
      {{ status().text }}
    </p>
  </aside>

  <main id="main" class="min-w-0 px-4 py-5 sm:px-7 sm:py-6">
    <router-outlet />
  </main>
</div>
