# oapi-codegen settings for the inspect API. The spec is the source of truth:
# change api/openapi/inspect.yaml, then `make generate-api`.
package: api
generate:
  models: true
  std-http-server: true
  strict-server: true
output: inspect.gen.go
output-options:
  # ChangeBatch is the data of an event stream, which no operation names as a
  # JSON body; it is kept for the server to write.
  skip-prune: true
