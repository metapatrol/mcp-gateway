# Tool sets select from exactly one server, by name or by glob pattern: "*"
# matches any run of characters, dots included, "?" exactly one.
#
#   kubectl get mcptoolsets -o wide     # the Resolved column shows what each selects
apiVersion: mcp-gateway.metapatrol.com/v1alpha1
kind: MCPToolSet
metadata:
  name: source-intelligence-analysis
spec:
  serverRef: source-intelligence
  tools:
    - code.*
    - repositories.*
    - refs.list
  exclude:
    - repositories.read_file
---
apiVersion: mcp-gateway.metapatrol.com/v1alpha1
kind: MCPToolSet
metadata:
  name: artifact-read
spec:
  serverRef: artifact
  tools:
    - artifact_search
    - artifact_get
---
# A pattern also selects tools the backend adds later. For a set that may
# write, exclude what should never be granted by accident.
apiVersion: mcp-gateway.metapatrol.com/v1alpha1
kind: MCPToolSet
metadata:
  name: artifact-readwrite
spec:
  serverRef: artifact
  tools:
    - artifact_*
  exclude:
    - artifact_delete
---
# Two backends that name a tool alike cannot both be granted to one subject
# under that name: neither would be exposed. Renaming the tools of one of them
# resolves it. Selection still uses the backend's names.
apiVersion: mcp-gateway.metapatrol.com/v1alpha1
kind: MCPToolSet
metadata:
  name: engram-memory-read
spec:
  serverRef: engram
  tools:
    - memory_*
  exclude:
    - memory_remember
  prefix: engram_              # memory_list   -> engram_memory_list
  aliases:
    memory_search: recall      # memory_search -> recall
