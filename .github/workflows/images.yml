# Images for the GitHub mirror, published to GitHub Packages (ghcr.io).
#
# The repository lives on Forgejo, which builds, tests and releases it and
# pushes its images to the internal registry (.forgejo/workflows). GitHub gets
# a push mirror of it: branches and tags arrive as pushes, and this workflow
# builds the same Dockerfile from them for everyone outside that network. It
# publishes nothing else and decides nothing — versions are semantic-release's,
# on Forgejo; a tag arriving here is only built.
#
# Forgejo reads .forgejo/workflows and ignores this directory.
#
#   ghcr.io/metapatrol/mcp-gateway{,-controller,-proxy,-ui}
#     :1.9.0 :1.9 :latest   from a release tag
#     :main :<short sha>    from main
#
# mcp-gateway-ui's @metapatrol packages come from the forge's npm registry,
# which GitHub cannot reach. The brand's own GitHub mirror publishes the same
# versions to GitHub Packages, so this build points web/ui at that registry
# and reads it with its GITHUB_TOKEN.
#
# A release tagged before this workflow existed is built by running it by hand
# with that tag: the tag's source, this commit's Dockerfile — an older one
# pulls its base images from the internal registry, which GitHub cannot reach.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.9.0. Empty builds the branch it runs on.
        required: false
        default: ""
      latest:
        description: Also tag it latest — for the newest release only.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary: [mcp-gateway-controller, mcp-gateway, mcp-gateway-proxy, mcp-gateway-ui]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build arguments
        id: args
        run: |
          # This workflow's own Dockerfile, which a tag built by hand may predate.
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:Dockerfile" > "$RUNNER_TEMP/Dockerfile"

          ref="${TAG:-$GITHUB_REF_NAME}"
          commit=$(git rev-parse HEAD)
          # ghcr.io wants the owner in lower case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.binary }}" >> "$GITHUB_OUTPUT"
          echo "revision=$commit" >> "$GITHUB_OUTPUT"
          echo "commit=${commit::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${commit::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.args.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.args.outputs.tag }},enable=${{ steps.args.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.args.outputs.tag }},enable=${{ steps.args.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.latest == true }}
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=raw,value=${{ steps.args.outputs.commit }}
          labels: |
            org.opencontainers.image.title=${{ matrix.binary }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.args.outputs.revision }}
            org.opencontainers.image.version=${{ steps.args.outputs.version }}

      # The console's packages from GitHub Packages instead of the forge (see
      # above). The lockfile keeps their versions but loses their forge
      # tarball URLs and checksums: the tarballs on GitHub are built there,
      # so npm resolves each version through the registry configured here.
      - name: Point the console at GitHub Packages
        if: matrix.binary == 'mcp-gateway-ui'
        working-directory: web/ui
        run: |
          set -eu
          {
            echo "@metapatrol:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NPM_TOKEN}"
          } > .npmrc
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            let n = 0;
            for (const [path, entry] of Object.entries(lock.packages)) {
              if (path.startsWith("node_modules/@metapatrol/")) { delete entry.resolved; delete entry.integrity; n++; }
            }
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            console.log(`${n} @metapatrol packages from GitHub Packages`);
          '

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ steps.args.outputs.commit }}
            BUILT_AT=${{ steps.args.outputs.built_at }}
            NODE_IMAGE=docker.io/library/node:24-alpine
            GO_IMAGE=docker.io/library/golang:1.27-alpine
          # read by the console's npm ci only (see the Dockerfile's ui stage)
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,scope=${{ matrix.binary }},mode=max
