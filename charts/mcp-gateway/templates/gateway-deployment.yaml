{{- $oauth := .Values.gateway.oauth -}}
{{- if and (not $oauth.jwksURL) (not $oauth.introspection.url) -}}
{{- fail "gateway.oauth: set jwksURL, introspection.url, or both — the gateway refuses to start without a way to verify tokens" -}}
{{- end -}}
{{- $inspect := .Values.gateway.inspect -}}
{{- $inspectOn := include "mcp-gateway.inspect.enabled" . -}}
{{- if and $inspectOn (not (include "mcp-gateway.inspect.serviceAccounts" .)) -}}
{{- fail "gateway.inspect: set serviceAccounts, or enable ui — the inspect API is never open to whoever reaches the port" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.gateway.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        mcp-gateway.metapatrol.com/chart-version: {{ .Chart.Version | quote }}
        {{- with .Values.gateway.instructions }}
        {{- /* The text is read at startup, so a new one rolls the pods. */}}
        mcp-gateway.metapatrol.com/instructions-checksum: {{ . | sha256sum | trunc 16 | quote }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-gateway.gateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.gateway.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.gateway.healthProbeBindAddress }}
            - --mcp-bind-address={{ .Values.gateway.mcpBindAddress }}
            - --mcp-path={{ .Values.gateway.mcpPath }}
            - --log-format={{ .Values.logging.format }}
            - --secret-namespace={{ .Release.Namespace }}
            {{- with $oauth.issuer }}
            - --oauth-issuer={{ . }}
            {{- end }}
            {{- with $oauth.audience }}
            - --oauth-audience={{ . }}
            {{- end }}
            {{- with $oauth.jwksURL }}
            - --oauth-jwks-url={{ . }}
            {{- end }}
            {{- with $oauth.introspection.url }}
            - --oauth-introspection-url={{ . }}
            - --oauth-introspection-cache-ttl={{ $oauth.introspection.cacheTTL }}
            {{- end }}
            {{- with $oauth.introspection.clientID }}
            - --oauth-introspection-client-id={{ . }}
            {{- end }}
            - --oauth-subject-claim={{ $oauth.subjectClaim }}
            {{- with .Values.gateway.resourceURL }}
            - --resource-url={{ . }}
            {{- end }}
            {{- with .Values.gateway.authorizationServers }}
            - --authorization-servers={{ join "," . }}
            {{- end }}
            {{- with .Values.gateway.scopesSupported }}
            - --scopes-supported={{ join "," . }}
            {{- end }}
            - --catalog-max-age={{ .Values.gateway.catalogMaxAge }}
            - --call-timeout={{ .Values.gateway.callTimeout }}
            {{- if .Values.gateway.instructions }}
            - --instructions-file=/etc/mcp-gateway/instructions/instructions.md
            {{- end }}
            {{- if $inspectOn }}
            - --inspect-bind-address={{ $inspect.bindAddress }}
            - --inspect-token-audience={{ $inspect.tokenAudience }}
            - --inspect-service-accounts={{ include "mcp-gateway.inspect.serviceAccounts" . }}
            {{- end }}
          {{- if or $oauth.introspection.clientSecretRef.name .Values.gateway.env .Values.gateway.tracing.endpoint }}
          env:
            {{- with .Values.gateway.tracing }}
            {{- if .endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | default "mcp-gateway" | quote }}
            {{- end }}
            {{- end }}
            {{- with $oauth.introspection.clientSecretRef }}
            {{- if .name }}
            - name: MCP_GATEWAY_INTROSPECTION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key | default "client-secret" }}
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: mcp
              containerPort: {{ include "mcp-gateway.port" .Values.gateway.mcpBindAddress }}
              protocol: TCP
            - name: metrics
              containerPort: {{ include "mcp-gateway.port" .Values.gateway.metricsBindAddress }}
              protocol: TCP
            - name: health
              containerPort: {{ include "mcp-gateway.port" .Values.gateway.healthProbeBindAddress }}
              protocol: TCP
            {{- if $inspectOn }}
            - name: inspect
              containerPort: {{ include "mcp-gateway.port" $inspect.bindAddress }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- /*
            Ready once the policy has been read. Before that the gateway would
            answer every agent with an empty tool list.
          */}}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .Values.gateway.instructions }}
          volumeMounts:
            - name: instructions
              mountPath: /etc/mcp-gateway/instructions
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if .Values.gateway.instructions }}
      volumes:
        - name: instructions
          configMap:
            name: {{ include "mcp-gateway.gateway.fullname" . }}-instructions
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
