{{- if .Values.ui.enabled }}
{{- $tokenDir := "/var/run/secrets/mcp-gateway/inspect" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.ui.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        mcp-gateway.metapatrol.com/chart-version: {{ .Chart.Version | quote }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-gateway.ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.ui.image) }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          args:
            - --listen-address={{ .Values.ui.listenAddress }}
            - --gateway-url={{ include "mcp-gateway.inspect.url" . }}
            - --token-file={{ $tokenDir }}/token
            - --log-format={{ .Values.logging.format }}
          {{- with .Values.ui.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "mcp-gateway.port" .Values.ui.listenAddress }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: inspect-token
              mountPath: {{ $tokenDir }}
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        {{- /*
          A token for the inspect API's audience and nothing else. The kubelet
          renews it before it expires; the console re-reads the file.
        */}}
        - name: inspect-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.gateway.inspect.tokenAudience }}
                  expirationSeconds: 3600
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{/*
  The console. ClusterIP by default: reach it with a port-forward, or put an
  ingress with an authenticating proxy in front — it has no sign-in of its own.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gateway.ui.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mcp-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
