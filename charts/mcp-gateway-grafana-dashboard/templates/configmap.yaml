{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway-grafana-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway-grafana-dashboard.labels" . | nindent 4 }}
    {{ .Values.grafana.dashboard.label }}: {{ .Values.grafana.dashboard.labelValue | quote }}
  annotations:
    {{- if .Values.grafana.dashboard.folder }}
    {{ .Values.grafana.dashboard.folderAnnotation }}: {{ .Values.grafana.dashboard.folder | quote }}
    {{- end }}
data:
  mcp-gateway.json: |
    {{ .Files.Get "dashboards/mcp-gateway.json" | nindent 4 }}
{{- end }}
