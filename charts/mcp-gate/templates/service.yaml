{{/*
  The gateway's MCP endpoint — the one address agents are given.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gate.gateway.fullname" . }}
  labels:
    {{- include "mcp-gate.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: mcp
      port: {{ .Values.gateway.service.port }}
      targetPort: mcp
      protocol: TCP
  selector:
    {{- include "mcp-gate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- range $component := list "controller" "gateway" }}
{{- $values := index $.Values $component }}
---
{{/*
  Metrics, one Service per component. Rendered unconditionally: a Service with
  no consumer costs nothing, and the ServiceMonitor has nothing to select
  without it. The metrics label keeps the gateway's MCP Service out of the
  ServiceMonitor's selection.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gate.fullname" $ }}-{{ $component }}-metrics
  labels:
    {{- include "mcp-gate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    gate.metapatrol.com/metrics: "true"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ include "mcp-gate.port" $values.metricsBindAddress }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "mcp-gate.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
