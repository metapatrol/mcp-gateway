---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mcptoolsets.mcp.gate.metapatrol.com
spec:
  group: mcp.gate.metapatrol.com
  names:
    categories:
    - mcp-gate
    kind: MCPToolSet
    listKind: MCPToolSetList
    plural: mcptoolsets
    shortNames:
    - mcpts
    singular: mcptoolset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverRef
      name: Server
      type: string
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPToolSet is a curated subset of one MCPServer's tools.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MCPToolSetSpec selects tools from exactly one MCPServer.

              One server, never several: a tool set is a technical toolbox for one backend.
              Putting tools of different backends together is what MCPCapability is for,
              and keeping the two apart means a tool set can be verified against a single
              catalog.
            properties:
              serverRef:
                description: ServerRef is the name of the MCPServer the tools come
                  from.
                minLength: 1
                type: string
              tools:
                description: |-
                  Tools are the names of the tools selected, exactly as the backend lists
                  them. A name the backend does not expose makes the tool set Ready=False,
                  and the gateway exposes the tools that do exist.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
            required:
            - serverRef
            - tools
            type: object
          status:
            description: |-
              MCPToolSetStatus is the result of verifying the selection against the
              server's current catalog.
            properties:
              catalogRevision:
                description: |-
                  CatalogRevision is the server catalog the tools were last verified
                  against.
                type: string
              conditions:
                description: 'Conditions: Valid and Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              missingTools:
                description: MissingTools are the selected tools the server does not
                  currently expose.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation this status describes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
