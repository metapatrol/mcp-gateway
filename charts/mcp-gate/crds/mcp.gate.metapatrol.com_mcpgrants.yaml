---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: mcpgrants.mcp.gate.metapatrol.com
spec:
  group: mcp.gate.metapatrol.com
  names:
    categories:
    - mcp-gate
    kind: MCPGrant
    listKind: MCPGrantList
    plural: mcpgrants
    shortNames:
    - mcpg
    singular: mcpgrant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .spec.capabilities
      name: Capabilities
      type: string
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPGrant binds capabilities to a subject. Several grants may name the same
          subject; the subject gets the union of them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPGrantSpec assigns capabilities to an authenticated subject.
            properties:
              capabilities:
                description: |-
                  Capabilities are the names of the MCPCapabilities granted.

                  A name that does not resolve grants nothing, and the rest of the grant
                  still applies: an unresolved reference can narrow what a subject gets,
                  never widen it.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              subject:
                description: |-
                  Subject is the identity the gateway derives from a caller's access
                  token — by default the token's sub claim, which for the client
                  credentials grant is the OAuth client ID.

                  It is an opaque string on purpose. Nothing here says which OAuth
                  provider issued the token or which claim it came from; that mapping is
                  the gateway's configuration, and a grant written today keeps meaning the
                  same thing when the provider changes.
                minLength: 1
                type: string
            required:
            - capabilities
            - subject
            type: object
          status:
            description: MCPGrantStatus reports whether the grant resolves and is
              available.
            properties:
              conditions:
                description: 'Conditions: Valid and Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation this status describes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
